//file:noinspection GrUnresolvedAccess
//file:noinspection GroovyAssignabilityCheck

apply from: "${rootDir}/${rootProject.configurationPath}/shared-gradle-files/common.gradle"
apply from: "${rootDir}/${rootProject.configurationPath}/shared-gradle-files/checkstyle.gradle"

dependencies {
    implementation 'org.mybatis:mybatis-spring:' + rootProject.dependencyVersions.mybatisMybatisSpringVersion
    implementation 'org.mybatis:mybatis:' + rootProject.dependencyVersions.mybatisMybatisVersion
}

tasks.register('makeZip', Zip) {
    archiveBaseName.set("${moduleName}")
    from('sql/') {
        into('sql/')
    }
    archiveExtension.set('zip')
}

//Must be after makeZip is defined
apply from: "${rootDir}/" + rootProject.configurationPath + '/shared-gradle-files/publish.gradle'

jar.dependsOn makeZip